<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose It or Lose It</title>
    <style>
        @font-face { font-family: 'GreedyLouding'; src: url('GreedyLoudingDemo-6RJMg.otf'); }
        @font-face { font-family: 'HugMeTight'; src: url('HugMeTight-GzZq.ttf'); }

        :root {
            --pastel-blue: #AEC6CF;
            --pastel-green: #B3E5BE;
            --pastel-red: #FFB7B2;
            --pastel-purple: #CDB4DB;
            --pastel-yellow: #FFFFD1;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: sans-serif;
            overflow: hidden;
            background-color: #f0f0f0;
        }

        #game-container {
            width: 100vw; height: 100vh;
            background: url('background.png') no-repeat center center;
            background-size: 100% 100%;
            display: flex; flex-direction: column; align-items: center;
            position: relative;
        }

        #blur-container {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            transition: filter 0.3s ease;
        }

        .blurred { filter: blur(8px); pointer-events: none; }

        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white; padding: 40px; border-radius: 25px;
            text-align: center; max-width: 500px; border: 8px solid var(--pastel-purple);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal-content p { font-family: 'HugMeTight', sans-serif; font-size: 32px; margin-bottom: 20px; }
        .modal-btn { 
            font-family: 'GreedyLouding', sans-serif; font-size: 32px; 
            padding: 20px 50px; margin: 10px; border-radius: 15px; border: none; cursor: pointer;
        }

        #front-page {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%;
            z-index: 5;
        }

        .title { font-family: 'GreedyLouding', sans-serif; font-size: clamp(40px, 8vw, 80px); color: #333; margin-bottom: 20px; text-align: center; }
        .subtitle { font-family: 'HugMeTight', sans-serif; font-size: 24px; margin-bottom: 10px; }

        .player-options button, .start-btn, .action-btn {
            padding: 25px 50px; margin: 10px; border: none; border-radius: 20px;
            cursor: pointer; transition: transform 0.2s, background-color 0.2s;
            font-size: 32px;
        }

        .player-options button { font-family: 'HugMeTight', sans-serif; font-size: 32px; background-color: var(--pastel-blue); }
        .start-btn { font-family: 'GreedyLouding', sans-serif; font-size: 40px; background-color: var(--pastel-green); display: none; }
        .selected { border: 4px solid #555 !important; transform: scale(1.05); }

        #game-layout { 
            display: none; width: 100%; height: 100%; 
            flex-direction: column; align-items: center; 
            padding: 10px; box-sizing: border-box; 
        }
        
        #deck-area { display: flex; align-items: center; gap: 20px; margin-top: 5px; margin-bottom: 10px; }
        .card-pile { width: 80px; height: 110px; background: #fff; border-radius: 10px; box-shadow: 3px 3px 10px rgba(0,0,0,0.2); border: 2px solid #333; }
        .draw-btn { font-family: 'GreedyLouding', sans-serif; font-size: 32px; background-color: var(--pastel-yellow); padding: 15px 45px; cursor: pointer; border-radius: 15px; border: none; }

        #player-columns { 
            display: flex; justify-content: center; width: 100%; height: 75%; 
            gap: 10px; margin-bottom: 5px; 
        }
        
        .column {
            flex: 1; max-width: 320px; background: rgba(255,255,255,0.85); 
            border-radius: 20px; padding: 15px; display: flex; flex-direction: column; align-items: center;
            transition: all 0.4s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .column.drag-over {
            background: rgba(205, 180, 219, 0.5) !important;
            border: 3px dashed #333;
        }

        .player-name { font-family: 'HugMeTight', sans-serif; font-size: clamp(18px, 2vw, 24px); margin-bottom: 5px; }

        .card-display { 
            width: 120px; height: 160px; 
            perspective: 1000px; 
            margin-bottom: 10px;
            transition: all 0.4s ease;
            position: relative;
        }

        .max-card { 
            width: 220px !important; 
            height: 300px !important; 
            margin-top: 30px !important;
        }

        .dragging { opacity: 0 !important; }

        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .flippable { cursor: pointer; pointer-events: auto !important; }
        .flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 10px; border: 2px solid #444;
            display: flex; align-items: center; justify-content: center;
            background: white; top: 0; left: 0;
        }

        .card-back {
            background-color: var(--pastel-yellow);
            transform: rotateY(180deg);
            font-family: Arial, sans-serif; 
            font-size: 36px; font-weight: bold; color: #d32f2f;
        }

        .card-img { width: 90%; height: 90%; object-fit: contain; pointer-events: none; }
        
        .choices-container { display: flex; flex-direction: column; gap: 8px; width: 100%; flex-grow: 1; justify-content: space-evenly; }
        .choice-btn { font-family: "Times New Roman", Times, serif; font-size: 24px; padding: 15px 5px; background: #fff; border: 2px solid #ddd; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; color: #444; }
        .choice-btn.selected-choice { background: var(--pastel-blue) !important; border-color: #333 !important; }

        .correct-glow { box-shadow: 0 0 25px 8px rgba(179, 229, 190, 1); background-color: #f0fff4 !important; }
        .wrong-gray { filter: grayscale(1); opacity: 0.6; background-color: #f0f0f0 !important; }
        .status-msg { font-family: 'GreedyLouding', sans-serif; font-size: 18px; margin-top: 5px; min-height: 24px; text-align: center; color: #333; }

        #game-footer { display: flex; width: 100%; justify-content: center; position: relative; padding: 10px; height: 80px; align-items: center; gap: 10px; }
        .new-game-btn { position: absolute; right: 20px; font-family: 'GreedyLouding', sans-serif; background: var(--pastel-red); font-size: 24px !important; }
        .fullscreen-btn { position: absolute; left: 20px; top: 20px; font-family: 'GreedyLouding', sans-serif; background: #eee; z-index: 10; font-size: 14px; padding: 8px 15px;}

        #drag-ghost-container {
            position: fixed; top: -500px; left: -500px;
            width: 150px; height: 200px;
            background: white; border: 2px solid #444; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            z-index: -999;
        }
        #drag-ghost-container img { width: 90%; height: 90%; object-fit: contain; }
    </style>
</head>
<body>

<div id="drag-ghost-container"></div>

<div id="modal-overlay">
    <div class="modal-content">
        <p>Do you want to exchange cards with another player who got the correct answer?</p>
        <button class="modal-btn" style="background: var(--pastel-green);" onclick="closeModal(true)">YES</button>
        <button class="modal-btn" style="background: var(--pastel-red);" onclick="closeModal(false)">NO</button>
    </div>
</div>

<div id="game-container">
    <div id="blur-container">
        <button class="action-btn fullscreen-btn" onclick="toggleFullscreen()">Fullscreen</button>
        <div id="front-page">
            <div class="title">Choose It or Lose It</div>
            <div class="subtitle">Choose how many players:</div>
            <div class="player-options">
                <button onclick="selectPlayers(2, this)">Two Players</button>
                <button onclick="selectPlayers(3, this)">Three Players</button>
                <button onclick="selectPlayers(4, this)">Four Players</button>
            </div>
            <button class="start-btn" id="start-btn" onclick="startGame()">Start Button</button>
        </div>

        <div id="game-layout">
            <div id="deck-area">
                <div class="card-pile"></div>
                <button class="draw-btn" id="draw-btn" onclick="drawCards()">Draw</button>
            </div>
            <div id="player-columns"></div>
            <div id="game-footer">
                <button class="action-btn" id="submit-btn" style="display:none; background: var(--pastel-purple); font-family: 'GreedyLouding';" onclick="submitAnswers()">Submit All Answers</button>
                <button class="action-btn" id="exchange-btn" style="display:none; background: var(--pastel-yellow); font-family: 'GreedyLouding';" onclick="triggerExchange()">Exchange Cards?</button>
                <button class="action-btn" id="next-btn" style="display:none; background: var(--pastel-green); font-family: 'GreedyLouding';" onclick="nextRound()">Next</button>
                <button class="action-btn new-game-btn" onclick="location.reload()">New Game</button>
            </div>
        </div>
    </div>
</div>

<script>
    const hobbyList = ["barbecuing", "camping", "taking photos", "mountain climbing", "cooking", "dancing", "drawing", "going on picnics", "fishing", "playing in a band", "singing", "collecting stamps", "traveling", "playing chess", "playing card games", "reading comics", "playing computer games", "playing with dolls", "surfing the Internet", "watching cartoons", "watching dramas", "reading novels", "solving puzzles", "flying kite"];
    let playerCount = 0;
    let players = [];
    const pointValues = [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];

    function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.log(e));
        else document.exitFullscreen();
    }

    function selectPlayers(count, btn) {
        playerCount = count;
        document.querySelectorAll('.player-options button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('start-btn').style.display = 'block';
    }

    function startGame() {
        document.getElementById('front-page').style.display = 'none';
        document.getElementById('game-layout').style.display = 'flex';
        players = [];
        const container = document.getElementById('player-columns');
        container.innerHTML = '';

        for (let i = 1; i <= playerCount; i++) {
            players.push({ id: i, history: [], currentCard: null, selectedAnswer: null, randomPoints: 0, isCorrect: false });
            const col = document.createElement('div');
            col.className = 'column';
            col.id = `col-${i}`;
            col.style.backgroundColor = ['#f0f9ff', '#fffdf0', '#fdfaff', '#fff5f5'][i-1];
            
            col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
            col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
            
            col.addEventListener('drop', e => {
                e.preventDefault();
                col.classList.remove('drag-over');
                const draggedId = e.dataTransfer.getData('text/plain');
                const draggedCard = document.getElementById(draggedId);
                const targetSlot = col.querySelector('.card-display');
                
                if (draggedCard && targetSlot) {
                    const existingCard = targetSlot.children[0];
                    const sourceSlot = draggedCard.parentElement;
                    if (existingCard && existingCard !== draggedCard) {
                        sourceSlot.appendChild(existingCard);
                    }
                    targetSlot.appendChild(draggedCard);
                }
            });

            col.innerHTML = `
                <div class="player-name">Player ${['One','Two','Three','Four'][i-1]}</div>
                <div class="card-display" id="display-slot-${i}"></div>
                <div class="status-msg" id="status-${i}"></div>
                <div class="choices-container" id="choices-${i}"></div>
            `;
            container.appendChild(col);
        }
    }

    function drawCards() {
        document.getElementById('draw-btn').disabled = true;
        document.getElementById('draw-btn').style.opacity = '0.5';
        players.forEach(player => {
            let available = hobbyList.filter(h => !player.history.includes(h));
            if (available.length === 0) { player.history = []; available = [...hobbyList]; }
            player.currentCard = available[Math.floor(Math.random() * available.length)];
            player.history.push(player.currentCard);
            player.randomPoints = pointValues[Math.floor(Math.random() * pointValues.length)];

            // FIXING THE FLYING KITES IMAGE PATH IF SPACES ARE AN ISSUE
            const imageFileName = player.currentCard; 

            const display = document.getElementById(`display-slot-${player.id}`);
            display.innerHTML = `<div class="card-inner-wrap" id="card-wrap-${player.id}" style="width:100%; height:100%;">
                <div class="card-inner" id="card-obj-${player.id}">
                    <div class="card-front"><img src="hobbiesicon/${imageFileName}.png" class="card-img"></div>
                    <div class="card-back">${player.randomPoints}</div>
                </div></div>`;
            
            let choices = [player.currentCard];
            while(choices.length < 5) {
                let rand = hobbyList[Math.floor(Math.random() * hobbyList.length)];
                if(!choices.includes(rand)) choices.push(rand);
            }
            choices.sort(() => Math.random() - 0.5);
            const choiceContainer = document.getElementById(`choices-${player.id}`);
            choiceContainer.innerHTML = '';
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice;
                btn.onclick = () => {
                    player.selectedAnswer = choice;
                    Array.from(choiceContainer.children).forEach(c => c.classList.remove('selected-choice'));
                    btn.classList.add('selected-choice');
                    if (players.every(p => p.selectedAnswer !== null)) document.getElementById('submit-btn').style.display = 'block';
                };
                choiceContainer.appendChild(btn);
            });
        });
    }

    function submitAnswers() {
        document.getElementById('submit-btn').style.display = 'none';
        players.forEach(player => {
            const col = document.getElementById(`col-${player.id}`);
            const status = document.getElementById(`status-${player.id}`);
            if (player.selectedAnswer === player.currentCard) {
                player.isCorrect = true;
                col.classList.add('correct-glow');
                status.innerText = "CORRECT!";
            } else {
                player.isCorrect = false;
                col.classList.add('wrong-gray');
                status.innerHTML = `Wrong! Answer: ${player.currentCard}`;
            }
        });
        // REPLACED AUTOMATIC MODAL WITH BUTTON VISIBILITY
        document.getElementById('exchange-btn').style.display = 'block';
    }

    function triggerExchange() {
        document.getElementById('blur-container').classList.add('blurred');
        document.getElementById('modal-overlay').style.display = 'flex';
        document.getElementById('exchange-btn').style.display = 'none';
    }

    function closeModal(agreedToDrag) {
        document.getElementById('blur-container').classList.remove('blurred');
        document.getElementById('modal-overlay').style.display = 'none';
        players.forEach(player => {
            const cardInner = document.getElementById(`card-obj-${player.id}`);
            const cardContainer = cardInner.parentElement;
            const displaySlot = cardContainer.parentElement;

            if (player.isCorrect) {
                if(agreedToDrag) {
                    document.getElementById(`status-${player.id}`).innerHTML = ""; 
                    document.getElementById(`choices-${player.id}`).innerHTML = ""; 
                    displaySlot.classList.add('max-card'); 
                    cardContainer.setAttribute('draggable', 'true');
                    
                    cardContainer.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('text/plain', cardContainer.id);
                        const ghost = document.getElementById('drag-ghost-container');
                        const currentImgSrc = cardInner.querySelector('.card-img').src;
                        ghost.innerHTML = `<img src="${currentImgSrc}">`;
                        e.dataTransfer.setDragImage(ghost, 75, 100);
                        setTimeout(() => cardContainer.classList.add('dragging'), 0);
                    });

                    cardContainer.addEventListener('dragend', () => {
                        cardContainer.classList.remove('dragging');
                    });
                }
                cardContainer.classList.add('flippable');
                cardContainer.onclick = () => cardContainer.classList.toggle('flipped');
            }
        });
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextRound() {
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('exchange-btn').style.display = 'none';
        document.getElementById('draw-btn').disabled = false;
        document.getElementById('draw-btn').style.opacity = '1';
        players.forEach(player => {
            player.selectedAnswer = null;
            player.isCorrect = false;
            const col = document.getElementById(`col-${player.id}`);
            col.classList.remove('correct-glow', 'wrong-gray');
            const slot = document.getElementById(`display-slot-${player.id}`);
            slot.innerHTML = '';
            slot.classList.remove('max-card');
            document.getElementById(`choices-${player.id}`).innerHTML = '';
            document.getElementById(`status-${player.id}`).innerText = '';
        });
    }
</script>
</body>
</html>
